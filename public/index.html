<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="description" content="CHAT COMMUNITY - Modern community platform">
    <title>CHAT COMMUNITY</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
</head>
<body>
    <div id="app">
        <div class="loading-screen" id="loading-screen">
            <div class="loading-logo">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                    <rect width="48" height="48" rx="12" fill="#6366f1"/>
                    <path d="M14 24C14 18.477 18.477 14 24 14C29.523 14 34 18.477 34 24C34 29.523 29.523 34 24 34" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M24 18V30M18 24H30" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </div>
        </div>

        <div class="app-container" id="app-container" style="display: none;">
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <div class="sidebar-logo">
                        <svg width="32" height="32" viewBox="0 0 48 48" fill="none">
                            <rect width="48" height="48" rx="12" fill="#6366f1"/>
                            <path d="M14 24C14 18.477 18.477 14 24 14C29.523 14 34 18.477 34 24C34 29.523 29.523 34 24 34" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                            <path d="M24 18V30M18 24H30" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                        </svg>
                        <span class="sidebar-title">CHAT COMMUNITY</span>
                    </div>
                </div>
                <nav class="sidebar-nav">
                    <a href="#" class="nav-item active" data-page="discover">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10 2a8 8 0 100 16 8 8 0 000-16zm0 2a6 6 0 110 12 6 6 0 010-12z"/>
                            <circle cx="10" cy="10" r="3"/>
                        </svg>
                        Discover
                    </a>
                    <a href="#" class="nav-item" data-page="communities">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v1h8v-1zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-1a5.972 5.972 0 00-1.292-3.764A8.01 8.01 0 0118 14.5V18zM4 18v-1a5.972 5.972 0 011.292-3.764A8.01 8.01 0 002 14.5V18z"/>
                        </svg>
                        Communities
                    </a>
                    <a href="#" class="nav-item" data-page="notifications">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"/>
                        </svg>
                        Notifications
                        <span class="badge" id="notification-badge" style="display: none;">0</span>
                    </a>
                    <a href="#" class="nav-item" data-page="profile">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
                        </svg>
                        Profile
                    </a>
                    <a href="#" class="nav-item" data-page="settings">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
                        </svg>
                        Settings
                    </a>
                </nav>
                <div class="sidebar-footer">
                    <button class="btn-logout" id="logout-btn">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 001 1h8a1 1 0 001-1v-3h-2v2H4V5h6v2h2V4a1 1 0 00-1-1H3zm11.707 4.293a1 1 0 010 1.414L12.414 11H9a1 1 0 100 2h3.414l-2.293 2.293a1 1 0 101.414 1.414l4-4a1 1 0 000-1.414l-4-4a1 1 0 10-1.414 1.414L12.414 11H9a1 1 0 100 2h3.414l-2.293 2.293a1 1 0 101.414 1.414l4-4a1 1 0 000-1.414l-4-4a1 1 0 10-1.414 1.414z" clip-rule="evenodd"/>
                        </svg>
                        Logout
                    </button>
                </div>
            </aside>

            <main class="main-content" id="main-content">
                <div class="top-bar" id="top-bar">
                    <button class="menu-toggle" id="menu-toggle">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                    <div class="top-bar-title" id="top-bar-title">Discover</div>
                    <div class="top-bar-actions" id="top-bar-actions"></div>
                </div>
                <div class="page-content" id="page-content"></div>
            </main>

            <aside class="context-panel" id="context-panel" style="display: none;">
                <div class="context-panel-content" id="context-panel-content"></div>
            </aside>
        </div>

        <div class="mobile-nav" id="mobile-nav" style="display: none;">
            <button class="mobile-nav-item active" data-page="discover">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 2a8 8 0 110 16 8 8 0 010-16z"/>
                    <circle cx="12" cy="12" r="4"/>
                </svg>
                <span>Discover</span>
            </button>
            <button class="mobile-nav-item" data-page="communities">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17 8a3 3 0 11-6 0 3 3 0 016 0zM7 10a2 2 0 110-4 2 2 0 010 4zM19 20v-2a6 6 0 00-12 0v2h12zM5 20v-2a5.97 5.97 0 011.3-3.8A8 8 0 003 17.5V20h2z"/>
                </svg>
                <span>Communities</span>
            </button>
            <button class="mobile-nav-item" data-page="messages">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 2H4a2 2 0 00-2 2v12a2 2 0 002 2h4l4 4 4-4h4a2 2 0 002-2V4a2 2 0 00-2-2z"/>
                </svg>
                <span>Chat</span>
            </button>
            <button class="mobile-nav-item" data-page="notifications">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2a7 7 0 00-7 7v4.5l-1 1A1 1 0 005 17h14a1 1 0 00.7-2.5l-1-1V9a7 7 0 00-7-7zm0 20a3.5 3.5 0 01-3.5-3.5h7A3.5 3.5 0 0112 22z"/>
                </svg>
                <span>Alerts</span>
                <span class="badge" id="mobile-notification-badge" style="display: none;">0</span>
            </button>
            <button class="mobile-nav-item" data-page="profile">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path fill-rule="evenodd" d="M12 11a4 4 0 100-8 4 4 0 000 8zm-8 10a8 8 0 1116 0H4z" clip-rule="evenodd"/>
                </svg>
                <span>Profile</span>
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay" style="display: none;">
        <div class="modal" id="modal">
            <div class="modal-header" id="modal-header"></div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script type="module" src="/script.js"></script>
</body>
  </html>
